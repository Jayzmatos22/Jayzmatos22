<svg xmlns="http://www.w3.org/2000/svg" width="960" height="46" viewBox="0 0 960 46" role="img" aria-label="Janela: MyWorld online">
<style>
text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.sweep { animation: sweep 4.5s linear infinite; } @keyframes sweep { to { transform: translateX(1180px); } }</style>
<defs><linearGradient id="sweep"><stop offset="0" stop-color="#3dff7a" stop-opacity="0"/><stop offset=".5" stop-color="#3dff7a"/><stop offset="1" stop-color="#3dff7a" stop-opacity="0"/></linearGradient><pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect y="2" width="4" height="1" fill="#000" opacity=".35"/></pattern><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<path d="M12.5 0.5 H947.5 A12 12 0 0 1 959.5 12.5 V46 H0.5 V12.5 A12 12 0 0 1 12.5 0.5 Z" fill="#0a0f0d" stroke="#1d2924"/>
<circle cx="24" cy="23" r="5.5" fill="#ff5f57"/><circle cx="42" cy="23" r="5.5" fill="#ffb547"/><circle cx="60" cy="23" r="5.5" fill="#3ddc6b"/>
<text x="84" y="27.5" font-size="13" fill="#b9c5be">~/projetos/myworld</text>
<circle cx="878.8" cy="23" r="4" fill="#3dff7a" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="936" y="27.5" text-anchor="end" font-size="12" fill="#3dff7a">online</text>
<rect class="sweep" x="-220" y="44.5" width="220" height="1.5" fill="url(#sweep)"/>
</svg>
